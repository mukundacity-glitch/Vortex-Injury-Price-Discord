name: Discord Webhook Test

on:
  # Offline-only validation runs for code and delivery-workflow repairs.
  # The live webhook test remains manual-only.
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'src/**', 'tests/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-code:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed Discord implementation
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline testing dependencies
        run: python -m pip install requests Pillow pytest
      - name: Syntax and source safety checks
        run: python -m compileall -q src
      - name: Brand, live-source and duplicate regression checks
        run: python -m pytest -q tests

  discord-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Send test message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is missing"
            exit 1
          fi

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ **FPL VORTEX DISCORD TEST**\n\n🏥 Discord webhook is connected successfully.\n📡 The FPL injury bot is ready for the next step."}' \
            "$DISCORD_WEBHOOK_URL"

          echo "Discord test message sent successfully."
