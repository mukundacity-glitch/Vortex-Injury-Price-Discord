name: FPL Vortex Injury News

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose what to run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - test
          - baseline
          - monitor

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: fpl-vortex-injury-news
  cancel-in-progress: false

jobs:
  injury-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow pytest

      - name: Restore injury state
        uses: actions/cache/restore@v6
        with:
          path: data
          key: fpl-injury-state-${{ github.run_id }}
          restore-keys: |
            fpl-injury-state-

      - name: Create data directory
        run: mkdir -p data

      - name: Validate original-branded graphics and dedup offline
        run: python -m pytest -q tests

      - name: Run FPL Vortex Injury Engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Mandatory original master, handles and honest-source rules are
          # opt-in until the real config is verified in staging.
          FPL_BRANDED_POSTS_ENABLED: ${{ vars.FPL_BRANDED_POSTS_ENABLED || 'false' }}
          FPL_TELEGRAM_HANDLE: ${{ vars.FPL_TELEGRAM_HANDLE || '' }}
          FPL_DISCORD_HANDLE: ${{ vars.FPL_DISCORD_HANDLE || '' }}
          FPL_BRAND_MASTER_BLOB_SHA: ${{ vars.FPL_BRAND_MASTER_BLOB_SHA || '' }}

          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'monitor' }}
        run: |
          python -m src.injury_bot

      - name: Save injury state
        if: success()
        uses: actions/cache/save@v6
        with:
          path: data
          key: fpl-injury-state-${{ github.run_id }}
